<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMEP Online</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#616e7c; --accent:#1f6feb; --line:#e4e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:40px 16px 60px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .sub { margin:0 0 32px; color:var(--muted); }
  section { margin-bottom:28px; }
  h2 { font-size:1.15rem; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  a { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; color:var(--text); text-decoration:none; font-weight:600; }
  a:hover, a:focus { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>AMEP Online</h1>
  <p class="sub">Choose a unit to start.</p>

  <section>
    <h2>Level 1</h2>
    <ul>
      <li><a href="Level%201/A%20party/">A party</a></li>
    </ul>
  </section>
</main>
</body>
</html>
