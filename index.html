<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMEP Online</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#616e7c; --accent:#1f6feb; --line:#e4e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:40px 16px 60px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .sub { margin:0 0 32px; color:var(--muted); }
  .sub a { color:var(--accent); }
  section { margin-bottom:28px; }
  h2 { font-size:1.15rem; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  h2 a { color:inherit; text-decoration:none; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  li a { display:block; height:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; color:var(--text); text-decoration:none; font-weight:600; }
  li a:hover, li a:focus { border-color:var(--accent); color:var(--accent); }
  .msg { color:var(--muted); }
  details.level { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
  details.level > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:16px 20px; font-size:1.15rem; font-weight:700; }
  details.level > summary::-webkit-details-marker { display:none; }
  details.level > summary::before { content:""; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:none; }
  details.level[open] > summary::before { transform:rotate(45deg); }
  details.level > summary:hover { color:var(--accent); }
  details.level > summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
  .count { margin-left:auto; font-size:.85rem; font-weight:500; color:var(--muted); }
  .body { padding:0 20px 18px; }
  .body li a { background:var(--bg); }
  .open-page { display:inline-block; margin-top:12px; font-size:.9rem; color:var(--accent); }
  .tools { display:flex; gap:16px; margin:-20px 0 16px; font-size:.9rem; }
  .tools button { background:none; border:0; padding:0; color:var(--accent); cursor:pointer; font:inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title">AMEP Online</h1>
  <p class="sub" id="sub">Choose a unit to start.</p>
  <div id="list"><p class="msg">Loading units…</p></div>
</main>
<script>
/* Lists every folder that contains an index.html, grouped by level.
   New units appear automatically after you upload them to GitHub. */
(function () {
  var OWNER = "Gr8Teachers", REPO = "AMEPOnline", BRANCH = "main";
  var list = document.getElementById("list");

  // Work out whether this page is the site home or a level page (e.g. /AMEPOnline/Level%201/)
  var parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  var repoIdx = parts.findIndex(function (p) { return p.toLowerCase() === REPO.toLowerCase(); });
  var after = repoIdx >= 0 ? parts.slice(repoIdx + 1) : [];
  if (after.length && /\.html?$/i.test(after[after.length - 1])) after.pop();
  var thisLevel = after.length ? after[0] : null;

  if (thisLevel) {
    document.title = thisLevel + " – AMEP Online";
    document.getElementById("title").textContent = thisLevel;
    document.getElementById("sub").innerHTML = '<a href="../">← All levels</a>';
  }

  var collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
  function enc(path) { return path.split("/").map(encodeURIComponent).join("/"); }
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/git/trees/" + BRANCH + "?recursive=1")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      // Units are folders of the form "<Level>/<Unit>/index.html"
      var levels = {};
      data.tree.forEach(function (item) {
        var p = item.path.split("/");
        if (item.type === "blob" && p.length === 2 && p[1].toLowerCase() === "index.html") {
          levels[p[0]] = levels[p[0]] || [];
        }
        if (item.type === "blob" && p.length === 3 && p[2].toLowerCase() === "index.html") {
          (levels[p[0]] = levels[p[0]] || []).push(p[1]);
        }
      });

      var names = Object.keys(levels).sort(collator.compare);
      if (thisLevel) names = names.filter(function (n) { return n === thisLevel; });

      list.innerHTML = "";
      if (!names.length) { list.appendChild(el("p", { "class": "msg" }, "No units yet.")); return; }

      function unitList(level, base) {
        var units = levels[level];
        if (!units.length) return el("p", { "class": "msg" }, "No units yet.");
        var ul = el("ul", {});
        units.sort(collator.compare).forEach(function (unit) {
          var li = el("li", {});
          li.appendChild(el("a", { href: base + enc(unit) + "/" }, unit));
          ul.appendChild(li);
        });
        return ul;
      }

      // Level page: plain list of its units
      if (thisLevel) {
        var sec = el("section", {});
        sec.appendChild(el("h2", {}, "Units"));
        sec.appendChild(unitList(thisLevel, ""));
        list.appendChild(sec);
        return;
      }

      // Home page: each level is a collapsible panel (closed by default)
      var KEY = "amep-open-levels", openSet = {};
      try { (JSON.parse(localStorage.getItem(KEY)) || []).forEach(function (n) { openSet[n] = 1; }); } catch (e) {}
      function save() {
        try {
          var open = [];
          list.querySelectorAll("details.level[open]").forEach(function (d) { open.push(d.dataset.level); });
          localStorage.setItem(KEY, JSON.stringify(open));
        } catch (e) {}
      }

      var tools = el("div", { "class": "tools" });
      var expand = el("button", { type: "button" }, "Expand all");
      var collapse = el("button", { type: "button" }, "Collapse all");
      expand.onclick = function () { list.querySelectorAll("details.level").forEach(function (d) { d.open = true; }); save(); };
      collapse.onclick = function () { list.querySelectorAll("details.level").forEach(function (d) { d.open = false; }); save(); };
      tools.appendChild(expand); tools.appendChild(collapse);
      list.appendChild(tools);

      names.forEach(function (level) {
        var base = enc(level) + "/";
        var n = levels[level].length;
        var d = el("details", { "class": "level" });
        d.dataset.level = level;
        if (openSet[level]) d.open = true;
        var s = el("summary", {}, level);
        s.appendChild(el("span", { "class": "count" }, n === 1 ? "1 unit" : n + " units"));
        d.appendChild(s);
        var body = el("div", { "class": "body" });
        body.appendChild(unitList(level, base));
        body.appendChild(el("a", { "class": "open-page", href: base }, "Open " + level + " page →"));
        d.appendChild(body);
        d.addEventListener("toggle", save);
        list.appendChild(d);
      });
    })
    .catch(function () {
      list.innerHTML = '<p class="msg">Couldn’t load the unit list right now. Please refresh in a minute.</p>';
    });
})();
</script>
</body>
</html>
